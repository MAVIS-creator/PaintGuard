<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Shield Primary Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Emerald Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Shield Shadow & Base -->
  <g filter="url(#dropShadow)">
    <path d="M 256 72 
             C 340 72, 400 96, 400 96 
             V 232 
             C 400 340, 310 416, 256 440 
             C 202 416, 112 340, 112 232 
             V 96 
             C 112 96, 172 72, 256 72 Z" 
          fill="url(#shieldGrad)" />
  </g>

  <!-- Inner Gloss Layer -->
  <path d="M 256 84 
           C 330 84, 384 105, 384 105 
           V 225 
           C 384 320, 305 388, 256 412 
           C 207 388, 128 320, 128 225 
           V 105 
           C 128 105, 182 84, 256 84 Z" 
        fill="url(#glossGrad)" />

  <!-- Shield Core Emblem (Clean Protection Checkmark & Core) -->
  <circle cx="256" cy="240" r="88" fill="#ffffff" opacity="0.12"/>
  
  <!-- Verification Checkmark Shield Mark -->
  <path d="M 204 242 
           L 240 278 
           L 312 202" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Top Star / Security Node Spark -->
  <circle cx="256" cy="144" r="10" fill="#ffffff"/>
</svg>
