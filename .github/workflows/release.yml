name: Build & Publish GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release VaultGuard 360
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate High-Res Icon (If Script Present)
        shell: powershell
        run: |
          if (Test-Path ".\ConvertLogoToIcon.ps1") {
            powershell -ExecutionPolicy Bypass -File .\ConvertLogoToIcon.ps1
          } else {
            Write-Host "ConvertLogoToIcon.ps1 not found. Using prebuilt icon.ico."
          }

      - name: Compile Custom WPF Installer (VaultGuard360_Setup.exe)
        shell: powershell
        run: |
          if (Test-Path ".\Build-Installer.ps1") {
            powershell -ExecutionPolicy Bypass -File .\Build-Installer.ps1
          } else {
            Write-Host "[1/3] Compiling Core App..."
            dotnet publish .\VaultGuard360.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\bin\Publish\
            
            Write-Host "[2/3] Packaging payload.zip..."
            Remove-Item ".\payload.zip" -ErrorAction SilentlyContinue
            Compress-Archive -Path ".\bin\Publish\*" -DestinationPath ".\payload.zip" -Force
            
            Write-Host "[3/3] Compiling Custom Installer..."
            dotnet publish .\VaultGuard360.Setup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\bin\SingleFilePublish\
            Copy-Item ".\bin\SingleFilePublish\VaultGuard360_Setup.exe" ".\VaultGuard360_Setup.exe" -Force
          }

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v2.5.0' }}
          name: VaultGuard 360 Release ${{ github.ref_name }}
          body: |
            ## 🛡️ VaultGuard 360 Antivirus & Vaccine Suite Release ${{ github.ref_name }}
            *Created by Klyvex Studios*

            ### 🚀 Assets Included:
            - `VaultGuard360_Setup.exe`: Custom WPF Windows Installer (Desktop Shortcuts, Auto-Start, Uninstaller)
            - `VaultGuard360.exe`: Standalone Native Windows App Host

            ### 🔐 Highlights:
            - Multi-Family Heuristic Scanner (Paint/Geacata, Shortcut Worms, Expiro PE Infector)
            - Real-Time Animated Toast Popups & System Tray Monitor
            - Dual-Compartment Clean-File & Quarantine Vault
            - USB Watchdog & Immunization Traps
          draft: false
          prerelease: false
          files: |
            VaultGuard360_Setup.exe
            VaultGuard360.exe
            icon.ico
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
